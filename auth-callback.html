<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in — CareConnect360</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8f9fa; color: #212529; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
        .spinner { width: 36px; height: 36px; margin: 0 auto 1rem; border: 4px solid #e9ecef; border-top-color: #0056b3; border-radius: 50%; animation: spin 0.8s linear infinite; }
        h1 { margin: 0 0 0.5rem; font-size: 1.2rem; color: #0056b3; }
        p { margin: 0; color: #6c757d; font-size: 0.9rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Signing you in</h1>
        <p id="status">Completing secure sign-in…</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/auth.js" defer></script>
    <script src="/auth-callback.js" defer></script>
</body>
</html>
