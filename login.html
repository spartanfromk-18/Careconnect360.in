<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — CareConnect</title>
    <script
      src="https://js-de.sentry-cdn.com/8c95014606a2fe163620b886475ee784.min.js"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/sentry.js" defer></script>
    <style>
        :root { --brand-blue: #0056b3; --bg-light: #f8f9fa; --border: #dee2e6; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg-light); color: #212529; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 2.5rem; width: 100%; max-width: 380px; }
        h1 { margin: 0 0 0.25rem; font-size: 1.4rem; color: var(--brand-blue); text-align: center; }
        .subtitle { margin: 0 0 1.75rem; color: #6c757d; font-size: 0.9rem; text-align: center; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
        input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; margin-bottom: 1.25rem; }
        input[type="password"]:focus { outline: none; border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(0,86,179,0.12); }
        .btn { width: 100%; padding: 11px 16px; cursor: pointer; background: var(--brand-blue); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .google-section { margin-bottom: 1.75rem; }
        .btn-google { width: 100%; padding: 11px 16px; cursor: pointer; background: #ffffff; color: #3c4043; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
        .btn-google:hover { background: #f8f9fa; }
        .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-google svg { width: 18px; height: 18px; }
        .or-divider { display: flex; align-items: center; gap: 10px; margin: 1.5rem 0 1.25rem; color: #adb5bd; font-size: 0.8rem; }
        .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .google-label { margin: 0 0 0.5rem; text-align: center; font-size: 0.85rem; color: #6c757d; }
        .error { display: none; margin-top: 1rem; padding: 10px 12px; background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; border-radius: 4px; font-size: 0.9rem; }
        .error.visible { display: block; }
        .footnote { margin-top: 1.5rem; font-size: 0.8rem; color: #adb5bd; text-align: center; }
        .footnote a { color: var(--brand-blue); }
    </style>
</head>
<body>
    <div class="card">
        <h1>CareConnect</h1>
        <p class="subtitle">Sign in to your account</p>
        <section class="google-section">
            <p class="google-label">Patients &amp; Nurses</p>
            <button class="btn-google" id="google-btn" type="button">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
                Continue with Google
            </button>
        </section>
        <div class="or-divider">or</div>
        <h1 style="font-size:1.1rem; margin-bottom:1rem;">Admin Access</h1>
        <p class="subtitle" style="margin-bottom:1rem;">Restricted area — authorized access only</p>
        <form id="login-form" novalidate>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required>
            <button class="btn" id="login-btn" type="submit">Sign In</button>
        </form>
        <p class="error" id="error-box" role="alert"></p>
        <p class="footnote">Have an active session? <a href="/admin">Go to the dashboard</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/auth.js" defer></script>
    <script src="/login-google.js" defer></script>
    <script>
        (function () {
            const form = document.getElementById('login-form');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-box');

            const showError = (message) => {
                errorBox.textContent = message;
                errorBox.classList.add('visible');
            };

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                errorBox.classList.remove('visible');

                const password = passwordInput.value;
                if (!password) {
                    showError('Please enter the admin password.');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in…';

                try {
                    const res = await fetch('/api/admin-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });

                    const data = await res.json().catch(() => ({}));

                    if (res.ok && data.token) {
                        sessionStorage.setItem('admin_token', data.token);
                        window.location.href = '/admin';
                        return;
                    }

                    const message = res.status === 429
                        ? 'Too many login attempts. Please wait a few minutes and try again.'
                        : res.status === 403
                            ? 'Access denied from your network. Contact the site administrator.'
                            : (data.error || 'Sign-in failed. Please check your password and try again.');
                    showError(message);
                } catch (err) {
                    console.error('[Admin] Login error:', err);
                    showError('Network error. Please try again.');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
