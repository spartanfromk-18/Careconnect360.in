# ═══════════════════════════════════════════════════════════════
# CARECONNECT360 ENTERPRISE CI/CD PIPELINE
# Architecture: Principal Staff Engineer Standard
# Focus: Security, Performance, Accessibility, Code Quality
# ══════════════════════════════════════════════════════════════

name:  CareConnect360 Enterprise Guardrails


on:
  push:
    branches: [main, security-and-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggers from GitHub UI

# Global Environment Variables
env:
  NODE_VERSION: '18'
  CI: true

# Cancel redundant runs if a new push is made
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: DEPENDENCY & SUPPLY CHAIN SECURITY
  # ─────────────────────────────────────────────────────────────
  supply-chain-security:
    name:  Supply Chain & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies (Clean Install)
        run: npm ci --ignore-scripts

      - name: 🚨 NPM Security Audit
        run: npm audit --audit-level=moderate --json > audit-results.json || true
        continue-on-error: false

      - name: 📊 Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json

  # ─────────────────────────────────────────────────────────────
  # JOB 2: HARDCODED SECRETS SCANNING (GITLEAKS)
  # ─────────────────────────────────────────────────────────────
  secrets-scanning:
    name: 🕵️ Hardcoded Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for accurate scanning

      - name: 🛡️ Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional for orgs

  # ─────────────────────────────────────────────────────────────
  # JOB 3: CODEQL ADVANCED SECURITY ANALYSIS
  # ─────────────────────────────────────────────────────────────
  codeql-analysis:
    name:  CodeQL Semantic Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name:  Autobuild
        uses: github/codeql-action/autobuild@v3

      - name:  Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ─────────────────────────────────────────────────────────────
  # JOB 4: FRONTEND QUALITY & SYNTAX VALIDATION
  # ─────────────────────────────────────────────────────────────
  frontend-quality:
    name: 🎨 Frontend Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧠 Validate Node.js API Syntax
        run: |
          echo "🔍 Checking all .js files in /api for syntax errors..."
          find api -name "*.js" -exec node --check {} \;
          echo "✅ All API routes are syntactically valid."

      - name: 📄 Validate HTML Structure
        run: |
          echo "🔍 Validating index.html structure..."
          if ! grep -q "<!DOCTYPE html>" index.html; then
            echo "❌ FATAL: Missing DOCTYPE!"
            exit 1
          fi
          if ! grep -q "</html>" index.html; then
            echo "❌ FATAL: Missing closing </html> tag!"
            exit 1
          fi
          if ! grep -q "<meta name=\"viewport\"" index.html; then
            echo "❌ FATAL: Missing viewport meta tag (Mobile responsiveness broken)!"
            exit 1
          fi
          echo "✅ HTML structure is enterprise-grade."

      - name: 🛑 Check for Exposed Live Secrets
        run: |
          echo " Scanning for hardcoded production secrets..."
          if grep -r "rzp_live_" . --exclude-dir=node_modules --exclude-dir=.git --exclude=ci.yml; then
            echo "❌ FATAL: Live Razorpay key found in source code!"
            exit 1
          fi
          if grep -r "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git --exclude=ci.yml; then
            echo "❌ FATAL: Live Stripe/Secret key found in source code!"
            exit 1
          fi
          if grep -r "pat[A-Za-z0-9]\{30,\}" . --exclude-dir=node_modules --exclude-dir=.git --exclude=ci.yml; then
            echo "❌ FATAL: Airtable Personal Access Token found in source code!"
            exit 1
          fi
          echo "✅ No hardcoded production secrets detected."

  # ─────────────────────────────────────────────────────────────
  # JOB 5: LIGHTHOUSE CI (PERFORMANCE, SEO, ACCESSIBILITY)
  # ─────────────────────────────────────────────────────────────
  lighthouse-ci:
    name: 🚀 Lighthouse Performance & Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🌍 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: ️ Start Local Server
        run: |
          npm install -g serve
          serve -s . -l 3000 &
          sleep 5
          echo "✅ Local server started on port 3000"

      - name: 🔦 Run Lighthouse Audit
        run: |
          lhci autorun --collect.url=http://localhost:3000 --collect.numberOfRuns=1 || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name:  Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/

  # ─────────────────────────────────────────────────────────────
  # JOB 6: DEPLOYMENT READINESS SUMMARY
  # ─────────────────────────────────────────────────────────────
  deployment-readiness:
    name: ✅ Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [supply-chain-security, secrets-scanning, codeql-analysis, frontend-quality, lighthouse-ci]
    if: always()
    steps:
      - name:  Check Pipeline Status
        run: |
          echo "🏁 CareConnect360 Enterprise Pipeline Complete."
          echo "---------------------------------------------"
          if [ "${{ needs.supply-chain-security.result }}" == "failure" ]; then echo "❌ Supply Chain Security: FAILED"; else echo "✅ Supply Chain Security: PASSED"; fi
          if [ "${{ needs.secrets-scanning.result }}" == "failure" ]; then echo "❌ Secrets Scanning: FAILED"; else echo "✅ Secrets Scanning: PASSED"; fi
          if [ "${{ needs.codeql-analysis.result }}" == "failure" ]; then echo "❌ CodeQL Analysis: FAILED"; else echo "✅ CodeQL Analysis: PASSED"; fi
          if [ "${{ needs.frontend-quality.result }}" == "failure" ]; then echo "❌ Frontend Quality: FAILED"; else echo "✅ Frontend Quality: PASSED"; fi
          if [ "${{ needs.lighthouse-ci.result }}" == "failure" ]; then echo "❌ Lighthouse CI: FAILED"; else echo "✅ Lighthouse CI: PASSED"; fi
          echo "---------------------------------------------"
          echo "🚀 Ready for Vercel Production Deployment!"